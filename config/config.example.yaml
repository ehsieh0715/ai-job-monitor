  - data analyst
  - analytics engineer
  location: Dublin, Ireland
  # Values and geographic limits: see config/README.md.
  # linkedin, indeed, glassdoor, zip_recruiter, bayt, naukri, bdjobs
  # google is recognized upstream but unavailable in this pipeline.
