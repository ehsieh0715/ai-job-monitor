  - linkedin
  - indeed
  hours_old: 6
  results_wanted: 100
  country_indeed: Ireland
  linkedin_fetch_description: true
# Target connector setup; legacy Python sync still requires credentials_path.
# See README migration status before attempting synchronization.
google_sheets:
